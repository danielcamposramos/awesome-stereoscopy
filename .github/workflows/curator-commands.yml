name: Curator commands
# Curators listed in .github/CURATORS (and the owner) can comment on a pull request:
#   /recheck     reruns the workflow runs of the pull request's current head
#   /scan-links  starts the weekly link scan now
# issue_comment runs on the default branch, so the CURATORS file read here is the one the code owner approved.
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: write
jobs:
  command:
    if: github.event.issue.pull_request && (startsWith(github.event.comment.body, '/recheck') || startsWith(github.event.comment.body, '/scan-links'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Is the commenter the owner or a listed curator?
        id: who
        env:
          LOGIN: ${{ github.event.comment.user.login }}
          ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          if [ "$ASSOCIATION" = OWNER ] || grep -qE "^${LOGIN}([[:space:]]|$)" .github/CURATORS; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "$LOGIN is not listed in .github/CURATORS; nothing done."
          fi
      - name: Acknowledge the command
        if: steps.who.outputs.allowed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/issues/comments/${{ github.event.comment.id }}/reactions" -f content=rocket --silent
      - name: Rerun the pull request's checks
        if: steps.who.outputs.allowed == 'true' && startsWith(github.event.comment.body, '/recheck')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh pr view "${{ github.event.issue.number }}" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
          runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&per_page=50" --jq '.workflow_runs[] | select(.event == "pull_request" and .status == "completed") | .id')
          [ -n "$runs" ] || { echo "No completed run found for $sha."; exit 0; }
          for run in $runs; do
            gh run rerun "$run" --repo "$GITHUB_REPOSITORY" && echo "Rerunning $run" || echo "Run $run could not be rerun (older than 30 days, or rerun 50 times already)."
          done
      - name: Start the link scan
        if: steps.who.outputs.allowed == 'true' && startsWith(github.event.comment.body, '/scan-links')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run weekly-links.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"
